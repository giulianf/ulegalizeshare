plugins {
    id 'java'
    id 'maven-publish'
//    id 'signing'
}
apply from: 'version.gradle'

group = applicationGroup
//archivesBaseName =  applicationName
version = applicationVersion
project.version = applicationVersion
description = applicationName


repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2')
    }
}
dependencies {
    implementation "com.fasterxml.jackson.core:jackson-core:${jackson}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jackson}"
    implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonAnnotation}"
    implementation("jakarta.annotation:jakarta.annotation-api:3.0.0")

    compileOnly "org.projectlombok:lombok:${lombok}"
    annotationProcessor "org.projectlombok:lombok:${lombok}"

    implementation "org.apache.commons:commons-lang3:${commonsLang}"

    testCompileOnly "org.projectlombok:lombok:${lombok}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombok}"
    testImplementation(platform("org.junit:junit-bom:${junitJupiterVersion}"))

    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testImplementation("org.junit.jupiter:junit-jupiter-params")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")

    // Required when using Gradle test task with JUnit Platform
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

// Ensure that Javadoc is generated
task generateJavadoc(type: Javadoc) {
    source = sourceSets.main.allJava
    classpath = configurations.compileClasspath
    options.memberLevel = JavadocMemberLevel.PRIVATE
    options.author = true
    options.version = true
    options.links("https://docs.oracle.com/en/java/javase/25/docs/api/")
}

java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

wrapper {
    gradleVersion = "9.7.1"
    distributionType = Wrapper.DistributionType.BIN
}

test {
    useJUnitPlatform()
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
